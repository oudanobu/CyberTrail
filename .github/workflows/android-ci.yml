name: CyberTrail Stable CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

env:
  CARGO_TERM_COLOR: always
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

permissions:
  contents: write

jobs:
  build:
    name: Build Rust + Android APK (Stable Pipeline)
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. Checkout
      # =========================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================
      # 2. Java (Fixed)
      # =========================
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: "17"

      # =========================
      # 3. Android SDK
      # =========================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # =========================
      # 4. Rust Toolchain
      # =========================
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      # =========================
      # 5. Rust Cache (SAFE)
      # =========================
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cybertrail-core -> target

      # =========================
      # 6. Build Rust FFI
      # =========================
      - name: Build Rust FFI (Android)
        working-directory: cybertrail-core
        run: |
          cargo install cargo-ndk || true
          cargo ndk -t arm64-v8a -t x86_64 \
            -o ../android/app/src/main/jniLibs \
            build -p cybertrail-ffi --release

      # =========================
      # 7. Validate Gradle Wrapper
      # =========================
      - name: Validate Gradle Wrapper
        working-directory: android
        run: |
          ls -lh gradle/wrapper
          file gradle/wrapper/gradle-wrapper.jar
          unzip -l gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          ./gradlew --version

      # =========================
      # 8. Build APK (STRICT WRAPPER ONLY)
      # =========================
      - name: Build APK
        working-directory: android
        run: |
          ./gradlew clean assembleDebug --no-daemon

      # =========================
      # 9. Generate Version
      # =========================
      - name: Generate Version
        run: |
          VERSION="cybertrail-v1.0.${{ github.run_number }}-$(date +%Y%m%d-%H%M)-${{ github.sha }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # =========================
      # 10. Rename APK
      # =========================
      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             cybertrail-${VERSION}.apk

      # =========================
      # 11. Upload Artifact
      # =========================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cybertrail-apk
          path: cybertrail-*.apk

      # =========================
      # 12. GitHub Release
      # =========================
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.VERSION }}
          artifacts: cybertrail-*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
