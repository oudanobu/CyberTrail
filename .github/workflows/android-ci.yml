name: CyberTrail Stable CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------
      # Setup Version Constraints
      # -------------------
      - name: Set Unified VERSION
        run: |
          VERSION="cybertrail-v1.0.0-build.${{ github.run_number }}-$(date +%Y%m%d-%H%M)-$(echo ${{ github.sha }} | cut -c1-7)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # -------------------
      # JDK
      # -------------------
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # -------------------
      # Android SDK
      # -------------------
      - name: Setup Android
        uses: android-actions/setup-android@v3

      # -------------------
      # Rust toolchain
      # -------------------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      # ❗ FIX 1: Rust cache 指定路径
      - name: Rust Cache (fixed path)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cybertrail-core -> target

      # -------------------
      # Build Rust FFI (FIX PATH)
      # -------------------
      - name: Build Rust FFI
        working-directory: cybertrail-core
        run: |
          cargo install cargo-ndk || true
          cargo ndk -t arm64-v8a -t x86_64 \
            -o ../android/app/src/main/jniLibs \
            build -p cybertrail-ffi --release

      # -------------------
      # Verify FFI build artifacts
      # -------------------
      - name: Verify FFI Output
        run: |
          ls -R android/app/src/main/jniLibs
          file android/app/src/main/jniLibs/arm64-v8a/*.so

      # -------------------
      # VERIFY & SELF-HEAL GRADLE WRAPPER (关键修复点)
      # -------------------
      - name: Verify Gradle Wrapper
        working-directory: android
        run: |
          chmod +x ./gradlew
          ls -lah gradle/wrapper/
          file gradle/wrapper/gradle-wrapper.jar || true
          ./gradlew --version

      # -------------------
      # Build APK
      # -------------------
      - name: Build APK
        working-directory: android
        run: |
          ./gradlew clean assembleDebug --no-daemon

      # -------------------
      # Rename APK with Unified Version
      # -------------------
      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk cybertrail-${{ env.VERSION }}.apk

      # -------------------
      # Release APK
      # -------------------
      - name: Release APK
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.VERSION }}
          name: CyberTrail ${{ env.VERSION }}
          artifacts: cybertrail-*.apk
          token: ${{ secrets.GITHUB_TOKEN }}

