name: Android CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & Publish Nightly APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android App Package (APK)
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Create Nightly Release and Upload APK
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: "Nightly Release"
          body: "Automatic nightly build of CyberTrail Offline Tactical Hiking System"
          allowUpdates: true
          removeArtifacts: true
          artifacts: "android/app/build/outputs/apk/debug/app-debug.apk"
          token: ${{ secrets.GITHUB_TOKEN }}
