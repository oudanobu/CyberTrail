name: CyberTrail CI + APK Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # Java
      # -------------------------
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # -------------------------
      # Android SDK
      # -------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # -------------------------
      # Rust
      # -------------------------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      # -------------------------
      # Fix Gradle Wrapper (关键)
      # -------------------------
      - name: Validate Gradle Wrapper
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --version

      # -------------------------
      # Build Rust FFI
      # -------------------------
      - name: Build Rust
        run: |
          cargo install cargo-ndk || true
          cargo ndk -t arm64-v8a -t x86_64 \
            -o android/app/src/main/jniLibs \
            build --package ffi --release

      # -------------------------
      # Build APK
      # -------------------------
      - name: Build APK
        run: |
          cd android
          ./gradlew clean assembleDebug --no-daemon

      # -------------------------
      # Find APK
      # -------------------------
      - name: Locate APK
        id: apk
        run: |
          echo "apk_path=$(find android -name '*.apk' | head -n 1)" >> $GITHUB_OUTPUT

      # -------------------------
      # Release APK (核心)
      # -------------------------
      - name: Upload Release APK
        uses: ncipollo/release-action@v1
        with:
          tag: nightly-${{ github.run_number }}
          name: CyberTrail Nightly Build
          artifacts: ${{ steps.apk.outputs.apk_path }}
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
